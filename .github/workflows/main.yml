name: Calculator Maven CI

on:
  push:
  pull_request:

jobs:

  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Compile project
        run: mvn clean compile

  test:
    name: Run JUnit Tests
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Run JUnit tests
        run: mvn test


  package:
    name: Package Application
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Package application
        run: mvn package
